aid: velaris
name: Velaris
description: Velaris is an AI-native Customer Success platform for mid-market and enterprise B2B SaaS
  teams, centralizing customer data, health scoring, churn and expansion signals, and lifecycle automation
  with AI agents and a Copilot workspace assistant. Its Public API (developers.velaris.io) exposes organizations,
  accounts, contacts, opportunities, risks, custom objects, activities, notes, tickets, tasks, users,
  surveys, currencies, and lifecycle stages over REST with user-scoped bearer tokens. Velaris is a Battery
  Ventures portfolio company.
