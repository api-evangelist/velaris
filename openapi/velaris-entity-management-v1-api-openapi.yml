    post:
      operationId: createOrganization
      summary: Create Organization
      tags:
      - Entity Management V1
      description: 'Create New Organization.


        Request body guide


        Field

        Description


        externalId

        Use externalId to add the external id of the organization.


        properties

        Use properties to add all the custom fields.


        contacts

        Use contacts to link contacts to an organization. Only accepts emails. Link existing contacts. Otherwise creates a contact with the given email and link it.


        owners

        User owners to add organization owners. Accepts object array with user id and the owner type.


        links

        Use links to link custom objects with organizations.


        Account Linking


        Cannot link accounts to an organization when creating an organization. There is a separate API (Change Parent Entity) in the Account section to assign accounts to an organization.'
      requestBody:
        content:
          application/json:
            example:
              properties:
                name: Optimum Nutritions
                date_joined: '2021-12-13'
                deal_stage: closed won
              contacts:
              - joe.root@velaris.io
              owners:
              - id: 12
                ownerType: primary
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                  organizationId: 309
