        Request body guide


        Field

        Description


        externalId

        Use externalId to add external id of the contact


        email

        Use email to add email id of the contact


        properties

        Use properties to add all the custom fields.


        organizationIds

        Use organizationIds to link contacts to an organization. Accepts Velaris internal Id. User either organizationIds or organizationExternalIds Example: [1, 2]


        organizationExternalIds

        Use organizationExternalIds to link contacts to an organization. Accepts external Id of the organization. User either organizationIds or organizationExternalIds Example: ["ajislk-1asdas-1231fg", "tcsd-gogk-asdm"]


        accountIds

        Use accountIds to link contacts to an acount. Accepts Velaris internal Id. User either accountIds or accountExternalIds Example: [1, 2]


        accountExternalIds

        Use accountExternalIds to link contacts to an acount. Accepts external Id of the account. User either accountIds or accountExternalIds Example: ["ajislk-1asdas-1231fg", "tcsd-gogk-asdm"]


        links

        Use links to link custom objects with contacts.'
      requestBody:
        content:
          application/json:
