              externalId: 32fd45-22fr4-yh23g-fg34-b5h6j34gd
              about: This is a test contact
              organizationIds:
              - 6
              - 7
              accountIds:
              - 1
              - 2
              properties:
                name: Matt Damen
      responses:
        '200':
