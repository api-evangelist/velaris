openapi: 3.2.0
info:
  title: Velaris Public Custom Objects API
  version: 1.0.0
  description: The Velaris Public API for the AI Customer Success Platform. Manage organizations, accounts, contacts, opportunities, risks, custom objects, activities, notes, tickets, tasks, users, surveys and more. Base URL https://api.euw1.velaris.io. Converted by API Evangelist from the provider-published public Postman collection (https://developers.velaris.io/).
  contact:
    name: Velaris
    url: https://www.velaris.io/
servers:
- url: https://api.euw1.velaris.io
  description: EU-West-1 production
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Custom Objects
paths:
  /core/:level/:id/links:
    get:
      operationId: getEntityCustomLinksById
      summary: Get Entity Custom Links By ID
      tags:
      - Custom Objects
      description: 'This endpoint retrieves the links associated with a specific entity at the given level and ID.


        Request


        Path Parameters


        level

        (string): Entity Level

        - Organization: ''organizations''

        - Account: ''accounts''

        - Contact: ''contacts''

        - Opportunity: ''opportunities''

        - Risk: ''risks''


        id

        (string): Entity ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        Example:


        With external id: /organizations/extid-id/links


        With internal id: /organizations/srcid-id/links


        Response


        The response will include the list of links associated with the specified entity.'
      responses:
        '200':
          description: Get Entity Custom Links By ID
          content:
            application/json:
              example:
                data:
                  custom_link_api1: []
                  custom_link_api2:
                  - 2470
                  custom_link_api3: []
                  custom_link_api4:
                  - 2984
                  custom_link_api5: []
    post:
      operationId: addCustomLinksForSystemEntities
      summary: Add Custom Links for System Entities
      tags:
      - Custom Objects
      description: 'This endpoint creates links for a specific system entity by passing its level and ID.


        Request


        Path Parameters


        apiName

        (string): Custom Link API Name


        id

        (string): Entity ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        level

        (string): Entity Level

        - Organization: ''organizations''

        - Account: ''accounts''

        - Contact: ''contacts''

        - Opportunity: ''opportunities''

        - Risk: ''risks''


        Request Body


        identifier_key

        External IDs - "ext_id"

        Internal IDs - "int_id"


        Example:


        With external id: /core/contacts/extid-id/links


        With internal id: /core/contacts/srcid-id/links


        Response


        The response will include the list of links successfully created for the specified system entity.'
      requestBody:
        content:
          application/json:
            example:
              links:
                invoice_contacts:
                  identifier_key: ext_id
                  ids:
                  - inv_343
                  - inv_5342
      responses:
        '200':
          description: Add Custom Links for System Entities
          content:
            application/json:
              example:
                data:
                  invoice_contacts:
                  - 243
                  - 543
  /custom-objects/:coApiName/:id/links:
    get:
      operationId: getCustomObjectInstanceCustomLinksById
      summary: Get Custom Object Instance Custom Links by ID
      tags:
      - Custom Objects
      description: 'This endpoint retrieves the links associated with a specific custom object by its API name and ID.


        Request


        Path Parameters


        coApiName

        (string): Custom Object API Name


        id

        (string): Custom Object Instance ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        Example:


        With external id: /custom-objects/invoices/extid-id/links


        With internal id: /custom-objects/invoices/srcid-id/links


        Response


        The response will include the list of links associated with the specified custom object instance.'
      responses:
        '200':
          description: Get Custom Object Instance Custom Links by ID
          content:
            application/json:
              example:
                data:
                  custom_link_api1:
                  - 343
                  custom_link_api2:
                  - 6324
                  custom_link_api3: []
                  custom_link_api4:
                  - 845
                  custom_link_api5: []
    post:
      operationId: addCustomLinksForCustomObjectInstances
      summary: Add Custom Links for Custom Object Instances
      tags:
      - Custom Objects
      description: 'This endpoint creates links for a specific custom object instance by its API name and ID.


        Request


        Path Parameters


        coApiName

        (string): Custom Object API Name.


        id

        (string): Custom Object Instance ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        Request Body


        identifier_key

        External IDs - "ext_id"

        Internal IDs - "int_id"

        Emails (For Contacts) - "email"


        Example:


        With external id: /custom-object/invoice/extid-id/links


        With internal id: /custom-object/invoice/srcid-id/links


        Response


        The response will include the list of links successfully created for the specified custom object instance.'
      requestBody:
        content:
          application/json:
            example:
              links:
                invoice_contacts:
                  identifier_key: email
                  ids:
                  - mehani@gmail.com
      responses:
        '200':
          description: Add Custom Links for Custom Object Instances
          content:
            application/json:
              example:
                data:
                  invoice_contacts:
                  - 343
                  invoice_accounts:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
  /core/:level/:id/links/:apiName:
    get:
      operationId: getEntityCustomLinksByLinkApiName
      summary: Get Entity Custom Links By Link Api Name
      tags:
      - Custom Objects
      description: 'This endpoint retrieves the links associated with a specific entity by its level, ID, and custom link API name.


        Request


        Path Parameters


        apiName

        (string): Custom Link API Name


        id

        (string): Entity ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        level

        (string): Entity Level

        - Organization: ''organizations''

        - Account: ''accounts''

        - Contact: ''contacts''

        - Opportunity: ''opportunities''

        - Risk: ''risks''


        Example:


        With external id: /core/opportunities/extid-id/links/custom_link__api3534


        With internal id: /core/opportunities/srcid-id/links/custom_link__api3534


        Response


        The response will include the list of links associated with the specified system entity.'
      responses:
        '200':
          description: Get Entity Custom Links By Link Api Name
          content:
            application/json:
              example:
                data:
                  custom_link_4563:
                  - 343
                  - 453
  /custom-objects/:coApiName/:id/links/:apiName:
    get:
      operationId: getCustomLinksForCustomObjectsByLinkApiName
      summary: Get Custom Links for Custom Objects By Link Api Name
      tags:
      - Custom Objects
      description: 'This endpoint retrieves the links associated with a specific custom object by its API name, ID, and custom link API name.


        Request


        Path Parameters


        coApiName

        (string): Custom Object API Name


        id

        (string): Custom Object Instance ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        apiName

        (string): Custom Link Api Name


        Example:


        With external id: /custom-object/invoice/extid-id/links/custom_link_api3534


        With internal id: /custom-object/invoice/srcid-id/links/custom_link_api3534


        Response


        The response will include the list of links associated with the specified custom object instance.'
      responses:
        '200':
          description: Get Custom Links for Custom Objects By Link Api Name
          content:
            application/json:
              example:
                data:
                  custom_link_api5:
                  - 745
                  - 345
                  - 243
                  - 14
  /core/:level/:id/links/archive:
    put:
      operationId: archiveCustomLinksForSystemEntity
      summary: Archive Custom Links for System Entity
      tags:
      - Custom Objects
      description: 'This endpoint archives existing links of a specific system entity by passing its level and ID.


        Request


        Path Parameters


        id

        (string): Entity ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        level

        (string): Entity Level

        - Organization: ''organizations''

        - Account: ''accounts''

        - Contact: ''contacts''

        - Opportunity: ''opportunities''

        - Risk: ''risks''


        Request Body


        identifier_key

        External IDs - "ext_id"

        Internal IDs - "int_id"


        Example:


        With external id: /core/contacts/extid-id/archive


        With internal id: /core/contacts/srcid-id/archive'
      requestBody:
        content:
          application/json:
            example:
              links:
                invoice_accounts:
                  identifier_key: int_id
                  ids:
                  - 4654
      responses:
        '200':
          description: Archive Custom Links for System Entity
          content:
            application/json:
              example:
                data:
                  invoice_accounts: []
  /custom-objects/:coApiName/:id/links/archive:
    put:
      operationId: archiveCustomLinksForCustomObjectInstance
      summary: Archive Custom Links for Custom Object Instance
      tags:
      - Custom Objects
      description: 'This endpoint archives existing links of a specific custom object instance by passing its API name and instance ID.


        Request


        Path Parameters


        coApiName

        (string): Custom Object API Name.


        id

        (string): Custom Object Instance ID

        Should be in the format "srcid-{velarisId}" when passing internal ID or "extid-{externalId} when passing external ID.


        Request Body


        identifier_key

        External IDs - "ext_id"

        Internal IDs - "int_id"

        Emails (For Contacts) - "email"


        Example:


        With external id: /custom-objects/invoice/extid-id/archive


        With internal id: /custom-objects/invoice/srcid-id/archive'
      requestBody:
        content:
          application/json:
            example:
              links:
                invoice_accounts:
                  identifier_key: int_id
                  ids:
                  - 876
                  - 453
                invoice_opportuniy:
                  identifier_key: ext_id
                  ids:
                  - opp434
                  - opp435
      responses:
        '200':
          description: Archive Custom Links for Custom Object Instance
          content:
            application/json:
              example:
                data:
                  invoice_accounts: []
                  invoice_opportuniy: []
  /custom-object-schemas:
    get:
      operationId: getCustomObjectDefinitions
      summary: Get Custom Object Definitions
      tags:
      - Custom Objects
      description: Returns list of custom object schemas. This includes information like custom object names, API names, and more.
      responses:
        '200':
          description: Sucess - 200
          content:
            application/json:
              example:
                status: success
                data:
                - customObjectId: 1
                  singularObjectName: invoice
                  pluralObjectName: invoices
                  icon: invoice-icon
                  apiName: invoice
                  externalId: invoice-object
                  primaryColor: '#9575FF'
                  isSystem: false
                  description: invoice object
                  pinnedUserId: null
                  isPinned: false
  /custom-objects/:co_api_name:
    get:
      operationId: getCoInstances
      summary: Get CO instances
      tags:
      - Custom Objects
      description: Returns list of custom object instances. This includes information like custom object id, system attributes, and custom attributes
      responses:
        '200':
          description: Success - 200
          content:
            application/json:
              example:
                status: success
                data:
                - customObjectInstanceId: 1
                  imageId: 1
                  about: about
                  externalId: invoice-1001
                  lifecycleStageId: null
                  entityArchived: 1
                  globalFields:
                    name: Invoice 1001
                  created: '2024-03-12T11:33:45.000Z'
                  modified: '2024-03-13T13:28:44.000Z'
                  createdBy: 13
                  modifiedBy: 1
                  properties:
                    name: Invoice 1001
                    subscription_id: subscription-002
        '404':
          description: Not Found - 404
    post:
      operationId: createCoInstance
      summary: Create CO instance
      tags:
      - Custom Objects
      description: Creates a custom object instance. External id, and custom attributes of the instance should be provided
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Success - 200
