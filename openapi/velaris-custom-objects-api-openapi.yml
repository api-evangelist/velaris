  /custom-objects/:co_api_name/:instanceId:
    get:
      operationId: getCoInstanceById
      summary: Get CO Instance by Id
      tags:
      - Custom Objects
      description: 'Returns the custom object instance with the given instance id. This includes the system attributes and the custom attributes of the instance.


        Custom object instance id should be in the following format.


        internal id → srcid-(internal id)


        external id → extid-(external id)


        example: srcid-1 , extid-abc-123'
      responses:
        '200':
          description: Success - 200
        '404':
          description: Not Found 404
  /custom-objects/:co_api_name/:instanceId/archive:
    put:
      operationId: archiveCoInstance
      summary: Archive CO instance
      tags:
      - Custom Objects
      description: 'Archives the custom object instance with the given instance id.


        Custom object instance id should be in the following format.


        internal id → srcid-(internal id)


        external id → extid-(external id)


        example: srcid-1 , extid-abc-123'
      responses:
        '200':
          description: Success - 200
  /custom-objects/:co_api_name/:instanceId/restore:
    put:
      operationId: restoreCoInstance
      summary: Restore CO Instance
      tags:
      - Custom Objects
      description: 'Restore the custom object instance with the given instance id.


        Custom object instance id should be in the following format.


        internal id → srcid-(internal id)


        external id → extid-(external id)


        example: srcid-1 , extid-abc-123'
      responses:
        '200':
          description: Success - 200
        '406':
          description: Not Acceptable - 406
  /custom-objects/:apiName/:instanceId:
    put:
      operationId: updateCoInstance
      summary: Update CO instance
      tags:
      - Custom Objects
      description: 'Updates custom object instance with the given instance id. External id, and custom attributes of the instance should be provided.


        Custom object instance id should be in the following format.


        internal id → srcid-(internal id)


        external id → extid-(external id)


        example: srcid-1 , extid-abc-123'
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Success 200
          content:
            application/json:
              example:
                status: success
                data:
                  externalId: invoice-0001
                  properties:
                    name: Invoice 0001
                  links:
                    custom_link_relation6:
                    - 76
        '404':
          description: Not Found - 404
  /custom-objects/:coApiName/search:
    post:
      operationId: searchCustomObjects
      summary: Search Custom Objects
      tags:
      - Custom Objects
      description: 'Search custom object instances using custom attributes


        The request body should contain a list of filters up to 3 filters


        filters - list of filters


        filter - object


        fieldName: API name of the custom attribute


        operator: operator which should be used in the filter


        value: filtered value


        Supported Operators


        Data type

        Operators


        String

        equals, contains


        Number

        equals, greaterThan, lessThan, greaterThanOrEqualTo, lessThanOrEqualTo


        Date

        equals, after, before, onOrAfter, onOrBefore


        Boolean

        equals


        Single Picklist

        equals


        Multi Picklist

        includes


        Organization / Account / Contact / User

        equals


        Organization / Account / Contact / User Picklist

        includes


        Valid Format of the value


        String: Value must be a non-empty string.


        Number: Value must be a valid number (can be provided as a string).


        Date: Value must be a date string in the format "YYYY-MM-DD".


        Boolean: Value must be a boolean string (''true'' or ''false'').


        Single Picklist, Organization, Account, Contact, User: Value must be a number.


        Multi Picklist, Organization Picklist, Account Picklist, Contact Picklist, User Picklist: Value must be a non-empty array of numbers.'
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Success - 200
          content:
            application/json:
              example:
                status: success
                data:
                - customObjectInstanceId: 179
                  imageId: null
                  about: null
                  externalId: test-externalid-2024-4
                  lifecycleStageId: null
                  entityArchived: 0
                  globalFields:
                    name: Hat 9
                  created: '2024-03-13T13:29:59.000Z'
                  modified: '2024-03-13T13:29:59.000Z'
                  createdBy: 1
                  modifiedBy: 1
                  properties:
                    name: Hat 9
                    about: this is about 2
  /v2/custom-objects/:coApiName/search:
    post:
      operationId: searchCustomObjectsV2
      summary: Search Custom Objects V2
      tags:
      - Custom Objects
      description: 'Search custom object instances using custom attributes


        The request body should contain a list of filters up to 3 filters


        Query Params


        limit

        Number of records to fetch


        after

        Last fetched instanceId


        archived

        Archived state(true/false)


        Request Body


        filters - list of filters


        filter - object


        fieldName: API name of the custom attribute


        operator: operator which should be used in the filter


        value: filtered value


        Supported Operators


        Data type

        Operators


        String

        equals, contains


        Number

        equals, greaterThan, lessThan, greaterThanOrEqualTo, lessThanOrEqualTo


        Date

        equals, after, before, onOrAfter, onOrBefore


        Boolean

        equals


        Single Picklist

        equals


        Multi Picklist

        includes


        Organization / Account / Contact / User

        equals


        Organization / Account / Contact / User Picklist

        includes


        Valid Format of the value


        String: Value must be a non-empty string.


        Number: Value must be a valid number (can be provided as a string).


        Date: Value must be a date string in the format "YYYY-MM-DD".


        Boolean: Value must be a boolean string (''true'' or ''false'').


        Single Picklist, Organization, Account, Contact, User: Value must be a number.


        Multi Picklist, Organization Picklist, Account Picklist, Contact Picklist, User Picklist: Value must be a non-empty array of numbers.'
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Success - 200
          content:
            application/json:
              example:
                status: success
                data:
                - customObjectInstanceId: 179
                  imageId: null
                  about: null
                  externalId: test-externalid-2024-4
                  lifecycleStageId: null
                  entityArchived: 0
                  globalFields:
                    name: Hat 9
                  created: '2024-03-13T13:29:59.000Z'
                  modified: '2024-03-13T13:29:59.000Z'
                  createdBy: 1
                  modifiedBy: 1
                  properties:
                    name: Hat 9
                    about: this is about 2
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'User-scoped access token. Header: Authorization: Bearer {access_token}. Create under Profile > Security > Access token.'
    basicAuth:
      type: http
      scheme: basic
      description: Legacy. Base64(username:password). Not available for SSO/MFA tenants.
