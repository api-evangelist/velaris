      operationId: getBaseCurrency
      summary: Get Base Currency
      tags:
      - Currencies
      responses:
        '200':
          description: Get Base Currency
          content:
            application/json:
              example:
                data:
                  currencyTypeId: 1
                  currencyDefinitionId: 5
                  isBase: true
                  isDefault: false
                  archived: 0
                  createdBy: 1
                  modifiedBy: 4
