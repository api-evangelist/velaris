detail: 'Two options: (1) Token-based - any user creates a user-scoped API token in-app under Profile > Security
  > Access token, sent as Authorization: Bearer {access_token}; works for SSO and non-SSO tenants. (2) Basic authentication
  (legacy) - Base64(username:password) of an administrator-privileged user, sent as Authorization: Basic {token};
  not available for SSO-enabled tenants.'
